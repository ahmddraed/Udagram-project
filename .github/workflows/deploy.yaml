name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

# (ECS / Fargate)
  backend:
    name: Backend Deploy (Fargate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Image
        run: |
          cd udagram-api
          docker build -t udagram-api .

      - name: Push Image
        run: |
          docker tag udagram-api ${{ secrets.DOCKER_USERNAME }}/udagram-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/udagram-api:latest

      - name: Deploy to Fargate
        run: |
          aws ecs update-service \
            --cluster udagram-cluster \
            --service my-api-service \
            --force-new-deployment

  frontend:
    name: Frontend Deploy (S3)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: Install dependencies
        run: |
         cd udagram-frontend
         npm ci

      - name: Build Angular
        run: |
          cd udagram-frontend
          npm run build -- --configuration production 

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
        
      - name: Deploy to S3
        run: |
          aws s3 sync udagram-frontend/www s3://${{ vars.FRONTEND_BUCKET }} --delete
